<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DST Control Plane</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand-lockup">
    <div class="brand-mark" aria-hidden="true"></div>
    <div>
      <h1>DST Control Plane</h1>
      <p class="subtitle"><span id="environment">connecting</span><span class="separator">/</span><span id="protocol">—</span></p>
    </div>
  </div>
  <div class="top-actions">
    <span id="systemState" class="system-state">CHECKING</span>
    <button id="addBtn" class="primary" disabled>Добавить аккаунт</button>
    <button id="logoutBtn" class="muted hidden">Выйти</button>
  </div>
</header>

<main>
  <section class="summary" aria-label="Сводка">
    <div class="metric metric-accent"><b id="accountCount">0</b><span>Аккаунты</span></div>
    <div class="metric"><b id="runningCount">0</b><span>Running</span></div>
    <div class="metric"><b id="errorCount">0</b><span>Требуют внимания</span></div>
    <div class="metric"><b id="jobCount">0</b><span>Active jobs</span></div>
  </section>

  <div class="title">
    <h2>Аккаунты</h2>
    <button class="muted" id="refresh">Обновить</button>
  </div>
  <section id="accounts" class="accounts"></section>

  <div class="title"><h2>Ноды</h2></div>
  <section id="nodes" class="table"></section>

  <div class="title"><h2>Задачи</h2></div>
  <section id="jobs" class="table"></section>

  <div class="title">
    <h2>События</h2>
    <div id="eventFilters" class="filters">
      <button class="muted active" data-filter="">ALL</button>
      <button class="muted" data-filter="ERROR">ERROR</button>
      <button class="muted" data-filter="ACCOUNT">ACCOUNT</button>
      <button class="muted" data-filter="RUNTIME">RUNTIME</button>
      <button class="muted" data-filter="NODE">NODE</button>
    </div>
  </div>
  <section id="events" class="table"></section>
</main>

<dialog id="loginDialog" class="auth-dialog">
  <form id="loginForm">
    <h3>Вход</h3>
    <label>Логин<input name="username" value="admin" required autocomplete="username"></label>
    <label>Пароль<input name="password" type="password" required autocomplete="current-password"></label>
    <button type="submit" class="primary">Войти</button>
    <p id="loginError" class="error"></p>
  </form>
</dialog>

<dialog id="accountDialog">
  <form id="accountForm">
    <div class="title"><h3>Новый аккаунт</h3><button type="button" class="muted" id="closeAccount">Закрыть</button></div>
    <label>Название<input name="label" placeholder="Account 001" required></label>
    <label>Steam username<input name="steam_username" required autocomplete="off"></label>
    <label>Steam password<input name="steam_password" type="password" autocomplete="new-password"></label>
    <button type="submit" class="primary">Создать</button>
    <p id="accountError" class="error"></p>
  </form>
</dialog>
<script src="/static/app.js"></script>
</body>
</html>
